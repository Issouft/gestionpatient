spring.config.import=optional:file:.env[.properties]

spring.application.name=gestionpatient

server.port =8081

spring.datasource.url=jdbc:postgresql://localhost:5432/gestionpatient
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
securite.jwt.secret=${JWT_SECRET}
securite.jwt.duree-minutes=60

# Envoi des emails (Gmail). L'identifiant et le mot de passe sont dans .env
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Page où le personnel choisit son mot de passe. Le jeton est ajouté à la fin du lien.
application.url-activation=http://localhost:3000/activation?jeton=


