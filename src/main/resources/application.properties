spring.config.import=optional:file:.env[.properties]

spring.application.name=gestionpatient

server.port =8081

spring.datasource.url=jdbc:postgresql://localhost:5432/gestionpatient
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Les tables sont créées et modifiées par Flyway (src/main/resources/db/migration), plus par Hibernate.
# validate : Hibernate vérifie seulement au démarrage que les entités correspondent aux tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Une base qui existait avant Flyway est marquée « version 1 » sans rejouer V1__schema_initial.sql.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
securite.jwt.secret=${JWT_SECRET}
securite.jwt.duree-minutes=60

# Envoi des emails (Gmail). L'identifiant et le mot de passe sont dans .env
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Adresse du frontend Angular (dossier frontend/). En production, mettre la vraie adresse dans FRONTEND_URL.
application.url-frontend=${FRONTEND_URL:http://localhost:4200}

# Page du frontend où le personnel choisit son mot de passe. Le jeton est ajouté à la fin du lien.
application.url-activation=${application.url-frontend}/activation?jeton=

# Page du frontend où l'on choisit un nouveau mot de passe après un oubli. Le jeton est ajouté à la fin du lien.
application.url-reinitialisation=${application.url-frontend}/reinitialisation?jeton=

# Swagger : page de test de l'API sur http://localhost:8081/swagger-ui.html
# Pratique en développement. En production, mettre SWAGGER_ACTIF=false pour ne pas montrer la liste des routes.
springdoc.api-docs.enabled=${SWAGGER_ACTIF:true}
springdoc.swagger-ui.enabled=${SWAGGER_ACTIF:true}
# Routes triées par chemin, et le jeton collé dans « Authorize » est gardé si la page est rechargée.
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
